name: Ajustar Animacao Das Conquistas

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  ajustar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Suavizar Expansao Das Conquistas
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/pages/Conquistas.tsx')
          text = path.read_text(encoding='utf-8')

          text = re.sub(r'initial=\{\{[^}]*?(?:height\s*:\s*0|scale[^}]*)[^}]*\}\}\s*animate=\{\{[^}]*?(?:height\s*:\s*["\']auto["\']|scale[^}]*)[^}]*\}\}\s*exit=\{\{[^}]*?(?:height\s*:\s*0|scale[^}]*)[^}]*\}\}', 'initial={{opacity:0}} animate={{opacity:1}} exit={{opacity:0}}', text)
          text = text.replace('transition={{duration:0.35}}', 'transition={{duration:0.16,ease:"easeOut"}}')
          text = text.replace('transition={{duration:0.4}}', 'transition={{duration:0.18,ease:"easeOut"}}')
          text = text.replace('transition={{duration:0.5}}', 'transition={{duration:0.2,ease:"easeOut"}}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit Alteracoes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'Nenhuma alteracao necessaria.'
            exit 0
          fi
          git add src/pages/Conquistas.tsx
          git commit -m '[Visual] Suavizar Animacao Das Conquistas'
          git push
