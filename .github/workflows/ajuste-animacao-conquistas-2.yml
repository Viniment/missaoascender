name: Ajustar Animacao Suave Das Conquistas

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  ajustar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remover Animacao Bruta Da Expansao
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/Conquistas.tsx')
          text = path.read_text(encoding='utf-8')
          text = text.replace(' key={x.tipo} layout onClick=', ' key={x.tipo} onClick=')
          text = text.replace('initial={{opacity:0,height:0}} animate={{opacity:1,height:"auto"}} className="mt-4 border-t', 'initial={{opacity:0}} animate={{opacity:1}} transition={{duration:0.14,ease:"easeOut"}} className="mt-4 border-t')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit Alteracoes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'Nenhuma alteracao necessaria.'
            exit 0
          fi
          git add src/pages/Conquistas.tsx
          git commit -m '[Visual] Suavizar Expansao Das Conquistas'
          git push
